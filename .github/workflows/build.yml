# Build, test, publish, and deploy Astraea.
#
# Security posture, after an adversarial review of the first version:
#
#  * `id-token: write` is granted per job, never workflow-wide. GitHub's OIDC
#    subject has no job component, so a token minted anywhere in a main-branch
#    run satisfies the trust policy — a job that runs `npm ci` must therefore
#    not be able to mint one at all.
#  * Two roles, not one. Build jobs (which execute third-party dependency code)
#    can only push to the two ECR repositories. The deploy job — which installs
#    nothing — is the only identity that can touch App Runner or S3.
#  * The deploy role cannot call UpdateService: that API rewrites a service's
#    whole source configuration, so it could point production at an arbitrary
#    public image and bypass the ECR scoping entirely. It gets StartDeployment,
#    which can only redeploy the image already configured.
#  * Every action is pinned to an immutable commit SHA. A version tag is a
#    movable ref, and these jobs hold credentials.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deliberately minimal at workflow scope; jobs opt in to what they need.
permissions:
  contents: read

concurrency:
  group: astraea-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  BUILD_ROLE: arn:aws:iam::793140950071:role/astraea-github-build
  DEPLOY_ROLE: arn:aws:iam::793140950071:role/astraea-github-deploy
  ECR_REGISTRY: 793140950071.dkr.ecr.us-east-2.amazonaws.com
  RECON_BUCKET: astraea-recon-793140950071

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test gate/Astraea.sln --nologo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build and push
        run: |
          docker build -f gate/Dockerfile \
            -t ghcr.io/${{ github.repository }}-gate:latest \
            -t ghcr.io/${{ github.repository }}-gate:${{ github.sha }} \
            -t $ECR_REGISTRY/astraea-gate:latest \
            -t $ECR_REGISTRY/astraea-gate:${{ github.sha }} .
          docker push --all-tags ghcr.io/${{ github.repository }}-gate
          docker push --all-tags $ECR_REGISTRY/astraea-gate

  portal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: portal
        run: |
          pip install -r requirements.txt
          python manage.py test adjudication
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.BUILD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build and push
        run: |
          docker build -f portal/Dockerfile \
            -t ghcr.io/${{ github.repository }}-portal:latest \
            -t ghcr.io/${{ github.repository }}-portal:${{ github.sha }} \
            -t $ECR_REGISTRY/astraea-portal:latest \
            -t $ECR_REGISTRY/astraea-portal:${{ github.sha }} .
          docker push --all-tags ghcr.io/${{ github.repository }}-portal
          docker push --all-tags $ECR_REGISTRY/astraea-portal

  recon:
    runs-on: ubuntu-latest
    # No AWS access and no token minting: this job runs `npm ci`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Typecheck and build
        working-directory: recon
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recon-dist
          path: recon/dist

  iac:
    runs-on: ubuntu-latest
    # Synthesis needs no AWS credentials (every stack pins its account and
    # region and performs no context lookups), so this job mints no token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Typecheck and synthesize every stack
        working-directory: flywheel
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth --all --quiet

  deploy:
    needs: [gate, portal, recon, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recon-dist
          path: dist
      - name: Sync the static app to S3
        run: aws s3 sync dist "s3://$RECON_BUCKET" --delete

      - name: Deploy both services and wait on each operation
        run: |
          set -euo pipefail
          # Poll the specific operation, not a fleet-wide status string: a
          # service that fails and rolls back returns to RUNNING, so watching
          # status alone lets a broken deploy pass as green.
          for svc in astraea-gate astraea-portal; do
            arn=$(aws apprunner list-services --region "$AWS_REGION" \
              --query "ServiceSummaryList[?ServiceName=='$svc'].ServiceArn" --output text)
            op=$(aws apprunner start-deployment --service-arn "$arn" \
              --region "$AWS_REGION" --query OperationId --output text)
            echo "$svc: operation $op"
            for _ in $(seq 1 60); do
              status=$(aws apprunner list-operations --service-arn "$arn" --region "$AWS_REGION" \
                --query "OperationSummaryList[?Id=='$op'].Status" --output text)
              case "$status" in
                SUCCEEDED) echo "$svc: succeeded"; break ;;
                FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED)
                  echo "::error::$svc deployment $status"; exit 1 ;;
                *) sleep 20 ;;
              esac
            done
            [ "$status" = "SUCCEEDED" ] || { echo "::error::$svc timed out ($status)"; exit 1; }
          done

      - name: Smoke-test the live deployment
        run: |
          set -euo pipefail
          host() {
            aws apprunner list-services --region "$AWS_REGION" \
              --query "ServiceSummaryList[?ServiceName=='$1'].ServiceUrl" --output text
          }
          gate="https://$(host astraea-gate)"
          portal="https://$(host astraea-portal)"
          # Capture then match: piping curl into grep -q under pipefail turns a
          # passing test into a SIGPIPE failure.
          body=$(curl -fsS "$gate/healthz")
          case "$body" in *'"status":"ok"'*) ;; *) echo "::error::gate unhealthy: $body"; exit 1 ;; esac
          nodes=$(curl -fsS "$gate/api/v1/nodes?pageSize=1")
          case "$nodes" in *'"total_items"'*) ;; *) echo "::error::lookup API broken"; exit 1 ;; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$portal/admin/login/")
          [ "$code" = "200" ] || { echo "::error::portal returned $code"; exit 1; }
          echo "smoke tests passed against $gate and $portal"
