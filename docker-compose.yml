# Local orchestration of the two backend services — the same images Phase 2
# ships to App Runner. Portal: http://localhost:8642 (demo / astraea-demo);
# gate: http://localhost:5210/healthz.
services:
  gate:
    build: ./gate
    ports:
      - "5210:8080"
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      ASTRAEA_GATE_URL: http://gate:8080
    ports:
      - "8642:8000"
    depends_on:
      - gate
